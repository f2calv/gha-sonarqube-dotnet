name: ci

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  lint:
    uses: f2calv/gha-workflows/.github/workflows/lint.yml@v1
    permissions:
      contents: read

  versioning:
    uses: f2calv/gha-workflows/.github/workflows/gha-release-versioning.yml@v1
    with:
      tag-and-release: false
    permissions:
      contents: read

  validate:
    needs: [versioning]
    uses: f2calv/gha-workflows/.github/workflows/readme-ref-check.yml@v1
    with:
      major: ${{ needs.versioning.outputs.major }}
    permissions:
      contents: read

  test:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      #bats-action publishes no floating major tag.
      - uses: bats-core/bats-action@4.1.0
        id: bats
        with:
          detik-install: false
          file-install: false

      - name: shellcheck
        run: shellcheck .scripts/analyze.sh tests/bash/fakes/*.sh && shellcheck -s bash tests/bash/analyze.bats

      - name: bats tests/bash
        env:
          BATS_LIB_PATH: ${{ steps.bats.outputs.lib-path }}
          TERM: xterm
        run: bats tests/bash

      - name: prepare fake scanner fixture
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/fake-bin" "$RUNNER_TEMP/fixture"
          cp tests/bash/fakes/dotnet.sh "$RUNNER_TEMP/fake-bin/dotnet"
          chmod +x "$RUNNER_TEMP/fake-bin/dotnet"
          touch "$RUNNER_TEMP/fixture/Example.slnx"
          echo "$RUNNER_TEMP/fake-bin" >> "$GITHUB_PATH"
          echo "FAKE_SCANNER=$PWD/tests/bash/fakes/scanner.sh" >> "$GITHUB_ENV"
          echo "COMMAND_LOG=$RUNNER_TEMP/commands" >> "$GITHUB_ENV"

      - uses: ./
        env:
          SONAR_TOKEN: fixture-token
        with:
          sonar-host-url: https://sonarqube.example.com
          sonar-project-key: example_project
          solution-name: Example.slnx
          project-base-directory: ${{ runner.temp }}/fixture

      - name: verify composite scanner submission
        run: grep -Fx 'scanner <end>' "$RUNNER_TEMP/commands"

  release:
    needs: [lint, versioning, validate, test]
    if: needs.versioning.outputs.release-exists == 'false'
      && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    uses: f2calv/gha-workflows/.github/workflows/gha-release-versioning.yml@v1
    with:
      semVer: ${{ format('{0}.{1}.{2}', needs.versioning.outputs.major, needs.versioning.outputs.minor, needs.versioning.outputs.patch) }}
    permissions:
      contents: write
