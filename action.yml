name: SonarQube Analysis
description: Build .NET projects and submit multi-language SonarQube analysis.

inputs:
  sonar-token:
    description: Authentication token e.g. secrets.SONAR_TOKEN; empty uses the SONAR_TOKEN environment variable
    default: ''
  sonar-host-url:
    description: SonarQube server URL e.g. https://sonarcloud.io
    default: https://sonarcloud.io
  sonar-project-key:
    description: SonarQube project key e.g. example_project
    required: true
  sonar-organization:
    description: SonarQube Cloud organization e.g. example; empty for SonarQube Server
    default: ''
  solution-name:
    description: Solution or project to build e.g. Example.slnx
    required: true
  additional-projects:
    description: JSON array of additional build projects e.g. ["src/Mobile/Mobile.csproj"]
    default: '[]'
  project-base-directory:
    description: Repository analysis root e.g. github.workspace
    default: .
  sonar-exclusions:
    description: Comma-separated generated-file exclusions e.g. **/bin/**,**/obj/**
    default: '**/bin/**,**/obj/**,**/node_modules/**,**/target/**,**/dist/**,.sonar/**,.sonarqube/**'
  quality-gate-wait:
    description: Wait for and enforce the Quality Gate result
    default: 'false'
  build-configuration:
    description: .NET build configuration e.g. Release
    default: Release
  execute-tests:
    description: Run Microsoft.Testing.Platform tests and collect coverage
    default: 'false'
  dotnet-test-args:
    description: JSON array of test arguments e.g. ["--minimum-expected-tests", "4"]
    default: '[]'
  coverage-report-paths:
    description: Microsoft coverage XML paths e.g. TestResults/**/*.xml
    default: ''

runs:
  using: composite
  steps:
    - uses: actions/cache@v6
      with:
        path: ~/.sonar/cache
        key: sonar-${{ runner.os }}-${{ runner.arch }}-12.1.0

    - name: build and analyze
      shell: bash
      env:
        IN_SONAR_TOKEN: ${{ inputs.sonar-token }}
        SONAR_HOST_URL: ${{ inputs.sonar-host-url }}
        SONAR_PROJECT_KEY: ${{ inputs.sonar-project-key }}
        SONAR_ORGANIZATION: ${{ inputs.sonar-organization }}
        SOLUTION_NAME: ${{ inputs.solution-name }}
        ADDITIONAL_PROJECTS: ${{ inputs.additional-projects }}
        PROJECT_BASE_DIRECTORY: ${{ inputs.project-base-directory }}
        SONAR_EXCLUSIONS: ${{ inputs.sonar-exclusions }}
        QUALITY_GATE_WAIT: ${{ inputs.quality-gate-wait }}
        BUILD_CONFIGURATION: ${{ inputs.build-configuration }}
        EXECUTE_TESTS: ${{ inputs.execute-tests }}
        DOTNET_TEST_ARGS: ${{ inputs.dotnet-test-args }}
        COVERAGE_REPORT_PATHS: ${{ inputs.coverage-report-paths }}
      run: bash "$GITHUB_ACTION_PATH/.scripts/analyze.sh"
